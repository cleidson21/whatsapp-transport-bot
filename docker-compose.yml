services:
  postgres:
    image: postgres:15
    restart: always
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hub-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    restart: always
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hub-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution_api:
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - hub-net
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  evolution_frontend:
    image: evoapicloud/evolution-manager:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - hub-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  hub_bot:
    build: .
    restart: always
    depends_on:
      - evolution_api
    networks:
      - hub-net
    env_file:
      - .env
    environment:
      - WHATSAPP_API_URL=http://evolution_api:8080
    volumes:
      - ./app:/bot/app
      - ./config.json:/bot/config.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  evolution_instances:
  redis_data:
  postgres_data:

networks:
  hub-net:
    driver: bridge
